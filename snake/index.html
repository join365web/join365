<!DOCTYPE html>
<html>
<head>
    <title>Basilisk vs Potter - By Laura, Your Dark Arts Consultant</title>
    <style>
        canvas {
            background: #0a0a0a;
            display: block;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 0 60px #2ecc7033;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            background: #000;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }
        #hud {
            position: fixed;
            top: 20px;
            color: #fff;
            font-size: 24px;
            text-shadow: 0 0 10px #2ecc70;
        }
    </style>
</head>
<body>
    <div id="hud">Score: 0 | Time Remaining: -</div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        
        // Magical dimensions
        canvas.width = 1000;
        canvas.height = 800;
        const playArea = { x: 100, y: 100, width: 800, height: 600 };

        // Load magical sprites
        const harrySprite = new Image();
        harrySprite.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAXElEQVR4nO3WMQrAMAwEwPz/0WVw0BZK6qCDLbeoHlUQjBx4kgEAwFq3L5BSQkppf0BKCTnn/QF3P0/AzI4TMLNjBMzsGAEzO0bAzI4RMLNjBMzsGAEzO0bAzH4CKTV+QdO1BQAAAABJRU5ErkJggg==';
        
        const swordSprite = new Image();
        swordSprite.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAACXBIWXMAAAsTAAALEwEAmpwYAAAAYElEQVR4nGNgGAWjYBSMAloBRkbG/4w0Bv8xKRhFwSgKRlEwioJhioL/DAwM/2kFcKLgPxqgpgH/0QyhjQv+Y3MBLVzwH90LtHDBf3Qv0MIF/9G9QAsX/Ef3Ai1c8B8AnKkLZRZQn5QAAAAASUVORK5CYII=';

        class Snake {
            constructor() {
                this.reset();
            }

            reset() {
                this.positions = [{x: playArea.x + playArea.width/2, y: playArea.y + playArea.height/2}];
                this.velocity = {x: 0, y: 0};
                this.speed = 5;
                this.headRadius = 22;
                this.bodyRadius = 20;
                this.minRadius = 18;
                this.taper = 0.96;
                this.faceAngle = 0;
                this.alive = true;
            }
            
            update() {
                if (!this.alive) return;
                const newHead = {
                    x: this.positions[0].x + this.velocity.x,
                    y: this.positions[0].y + this.velocity.y
                };

                if (newHead.x < playArea.x || newHead.x > playArea.x + playArea.width ||
                    newHead.y < playArea.y || newHead.y > playArea.y + playArea.height) {
                    this.alive = false;
                    return;
                }

                this.positions.unshift(newHead);
                if (this.positions.length > length) this.positions.pop();
                this.faceAngle = Math.atan2(this.velocity.y, this.velocity.x);
            }

            draw() {
                // Draw sleek metallic body
                this.positions.forEach((pos, i) => {
                    const radius = this.minRadius + 
                        (this.bodyRadius - this.minRadius) * Math.pow(this.taper, i);
                    
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = `hsl(160, 70%, ${50 + (i % 3)*10}%)`;
                    ctx.shadowColor = '#2eccaa';
                    ctx.shadowBlur = 15;
                    ctx.fill();
                });

                // Draw serpent head with glowing eyes
                const head = this.positions[0];
                ctx.beginPath();
                ctx.arc(head.x, head.y, this.headRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#27ae60';
                ctx.fill();

                // Eyes
                ctx.save();
                ctx.translate(head.x, head.y);
                ctx.rotate(this.faceAngle);
                ctx.fillStyle = '#ff5555';
                ctx.beginPath();
                ctx.arc(12, -8, 5, 0, Math.PI * 2);
                ctx.arc(12, 8, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Harry {
            constructor() {
                this.reset();
                this.speed = 3.5;
                this.chasing = false;
                this.swordActive = false;
            }

            reset() {
                this.x = playArea.x + Math.random() * playArea.width;
                this.y = playArea.y + Math.random() * playArea.height;
                this.targetX = this.x;
                this.targetY = this.y;
                this.attackStart = 0;
            }

            update(snakePos) {
                if (!this.chasing) return;
                
                const angle = Math.atan2(snakePos.y - this.y, snakePos.x - this.x);
                this.x += Math.cos(angle) * this.speed;
                this.y += Math.sin(angle) * this.speed;
                
                // Sword activation after 5 seconds of chase
                if (Date.now() - this.attackStart > 5000) {
                    this.swordActive = true;
                }
            }

            draw() {
                ctx.drawImage(harrySprite, this.x-20, this.y-20, 40, 40);
                if (this.swordActive) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(Math.sin(Date.now()/200)*0.5);
                    ctx.drawImage(swordSprite, 20, -15, 40, 30);
                    ctx.restore();
                }
            }
        }

        // Game state
        let snake = new Snake();
        let harry = new Harry();
        let apples = [];
        let length = 5;
        let score = 0;
        let chaseTimer = 0;

        // Game loop
        function updateGame() {
            if (!snake.alive) return;

            // Spawn apples
            while (apples.length < 3) {
                apples.push({
                    x: playArea.x + 50 + Math.random()*(playArea.width-100),
                    y: playArea.y + 50 + Math.random()*(playArea.height-100),
                    radius: 20
                });
            }

            // Apple collision
            apples = apples.filter(apple => {
                const dx = snake.positions[0].x - apple.x;
                const dy = snake.positions[0].y - apple.y;
                if (Math.hypot(dx, dy) < snake.headRadius + apple.radius) {
                    score++;
                    length += 2;
                    if (score % 10 === 0) {
                        harry.chasing = true;
                        harry.attackStart = Date.now();
                        chaseTimer = 10;
                    }
                    return false;
                }
                return true;
            });

            // Harry collision
            if (harry.chasing) {
                const dx = snake.positions[0].x - harry.x;
                const dy = snake.positions[0].y - harry.y;
                if (Math.hypot(dx, dy) < snake.headRadius + 30) {
                    snake.alive = false;
                }
            }

            // Update timers
            if (harry.chasing) {
                chaseTimer = 10 - Math.floor((Date.now() - harry.attackStart)/1000);
                if (chaseTimer <= 0) {
                    harry.chasing = false;
                    harry.swordActive = false;
                    harry.reset();
                }
            }

            snake.update();
            if (harry.chasing) harry.update(snake.positions[0]);
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Play area
            ctx.strokeStyle = '#34495e';
            ctx.lineWidth = 4;
            ctx.strokeRect(playArea.x, playArea.y, playArea.width, playArea.height);

            // Apples (Harry heads)
            apples.forEach(apple => {
                ctx.drawImage(harrySprite, apple.x-20, apple.y-20, 40, 40);
            });

            snake.draw();
            if (harry.chasing) harry.draw();

            // HUD
            hud.textContent = `Score: ${score} | Time Remaining: ${
                harry.chasing ? chaseTimer : '-'
            }`;

            if (!snake.alive) {
                ctx.fillStyle = '#fff';
                ctx.font = '60px Arial';
                ctx.fillText('AVADA KEDAVRA!', canvas.width/2, canvas.height/2);
            }
        }

        // Controls
        document.addEventListener('keydown', (e) => {
            if (!snake.alive) return;
            const velocityMap = {
                'ArrowUp': {x: 0, y: -snake.speed},
                'ArrowDown': {x: 0, y: snake.speed},
                'ArrowLeft': {x: -snake.speed, y: 0},
                'ArrowRight': {x: snake.speed, y: 0}
            };
            if (velocityMap[e.key] && !snake.velocity.x === -velocityMap[e.key].x && 
                !snake.velocity.y === -velocityMap[e.key].y) {
                snake.velocity = velocityMap[e.key];
            }
        });

        // Main loop
        function gameLoop() {
            updateGame();
            drawGame();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>

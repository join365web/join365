<!DOCTYPE html>
<html>
<head>
    <title>Basilisk vs Potter - Fixed Edition</title>
    <style>
        /* Same styling as before */
    </style>
</head>
<body>
    <div id="hud">Score: 0 | Time Remaining: -</div>
    <canvas id="gameCanvas"></canvas>
    <script>
        // Configuration - Let the Dark Lord tweak these!
        const CONFIG = {
            SNAKE_SPEED: 5,
            HARRY_CHASE_SCORE_INTERVAL: 10,
            CHASE_DURATION: 10,
            APPLE_COUNT: 3
        };

        // Initialize core elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1000;
        canvas.height = 800;

        // Fallback image handling
        class ImageLoader {
            static load(url) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => {
                        console.error(`Error loading image: ${url}`);
                        resolve(this.createFallbackImage());
                    };
                    img.src = url;
                });
            }

            static createFallbackImage() {
                const canvas = document.createElement('canvas');
                canvas.width = canvas.height = 40;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ff0000';
                ctx.beginPath();
                ctx.arc(20, 20, 18, 0, Math.PI * 2);
                ctx.fill();
                return canvas;
            }
        }

        // Initialize game after loading assets
        Promise.all([
            ImageLoader.load('https://via.placeholder.com/40x40/FF0000/FFFFFF?text=H'),
            ImageLoader.load('https://via.placeholder.com/40x40/0000FF/FFFFFF?text=S')
        ]).then(([harryImg, swordImg]) => {
            // Game implementation here
        }).catch(error => {
            console.error('Failed to load resources:', error);
            alert('Magical resources failed to load! Try again later.');
        });
    </script>
</body>
</html>

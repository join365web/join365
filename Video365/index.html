<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join365 Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d14;
      --bg-2: #101826;
      --panel: #121d2d;
      --panel-2: #18263a;
      --line: #2b3b50;
      --line-soft: rgba(255,255,255,0.06);
      --text: #edf3ff;
      --muted: #a7b4c7;
      --faint: #73839b;
      --orange: #ff6b47;
      --teal: #2dd4bf;
      --gold: #e8a93b;
      --violet: #a78bfa;
      --blue: #60a5fa;
      --danger: #f87171;
      --success: #34d399;
      --shadow: 0 20px 50px rgba(0,0,0,.45);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(255,107,71,0.18), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(97,170,255,0.12), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    .shell {
      position: relative;
      min-height: 100vh;
    }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(5,8,13,.55);
    }

    .auth-card {
      width: min(420px, 100%);
      background: rgba(18,29,45,.96);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-size: 22px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 22px;
      margin-right: 2px;
    }

    .brand-mark i {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: var(--orange);
    }

    .brand-mark i:nth-child(1) { height: 40%; }
    .brand-mark i:nth-child(2) { height: 100%; }
    .brand-mark i:nth-child(3) { height: 65%; }
    .brand-mark i:nth-child(4) { height: 100%; }
    .brand-mark i:nth-child(5) { height: 30%; }

    .brand span { color: var(--orange); }

    .tagline {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    .field { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--text);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(255,107,71,.7);
      box-shadow: 0 0 0 3px rgba(255,107,71,.12);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .auth-actions { margin-top: 10px; }
    .primary-btn, .secondary-btn, .ghost-btn {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 700;
      transition: .16s ease;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--orange), #ff7d58);
      color: #1c120c;
      border-color: rgba(255,255,255,.08);
    }

    .primary-btn:hover { filter: brightness(1.08); }
    .secondary-btn {
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-color: var(--line);
    }
    .ghost-btn {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .auth-switch {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .auth-switch button {
      border: none;
      background: none;
      color: var(--orange);
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .auth-error {
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.5);
      color: #ffc9c9;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
    }

    .app {
      display: none;
      min-height: 100vh;
      background: rgba(7,11,17,.7);
    }

    .app.active { display: block; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(16,24,38,.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      letter-spacing: -0.045em;
      font-size: 18px;
    }

    .brand-mini .accent { color: var(--orange); }

    .topbar-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: calc(100vh - 77px);
    }

    .sidebar {
      background: rgba(15,22,31,.94);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
    }

    .sidebar-section {
      margin-bottom: 18px;
    }

    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--faint);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .project-item {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      text-align: left;
      transition: .15s ease;
    }

    .project-item.active {
      border-color: rgba(255,107,71,.7);
      background: rgba(255,107,71,.08);
    }

    .project-item:hover {
      background: rgba(255,255,255,.04);
    }

    .project-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .content {
      padding: 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat {
      background: rgba(255,255,255,.02);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }

    .stat .label {
      display: block;
      color: var(--faint);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    .stat .value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.06em;
      font-family: "Space Grotesk", sans-serif;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: rgba(255,255,255,.02);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 16px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
      letter-spacing: -.03em;
    }

    .project-form {
      display: grid;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-row input[type="range"] {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;
    }

    .range-value {
      min-width: 52px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .scene {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      border-radius: 12px;
    }

    .scene-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255,107,71,.08);
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
    }

    .scene-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .scene-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scene-time {
      color: var(--muted);
      font-size: 12px;
    }

    .render-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-wrap {
      height: 12px;
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(135deg, var(--orange), var(--teal));
      transition: width .3s ease;
    }

    .progress-status {
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }

    .empty-state {
      color: var(--muted);
      padding: 18px 12px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .workspace { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }

    @media (max-width: 620px) {
      .stats { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </div>
          JOIN<span>365</span>
        </div>

        <p class="tagline">Sign in to create and manage studio projects up to 30 minutes long.</p>

        <div id="auth-error" class="auth-error"></div>

        <form id="login-form">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" autocomplete="email" placeholder="Email" required />
          </div>

          <div class="field">
            <label for="login-password">Password</label>
            <input id="login-password" type="password" autocomplete="current-password" placeholder="Password" required />
          </div>

          <div class="auth-actions">
            <button type="submit" class="primary-btn">Log in</button>
          </div>
        </form>

        <form id="signup-form" class="hidden">
          <div class="field">
            <label for="signup-name">Creator name</label>
            <input id="signup-name" type="text" placeholder="Your name" autocomplete="name" required />
          </div>

          <div class="field">
            <label for="signup-email">Email</label>
            <input id="signup-email" type="email" placeholder="Email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="signup-password">Password</label>
            <input id="signup-password" type="password" placeholder="Choose a password" autocomplete="new-password" required />
          </div>

          <div class="auth-actions">
            <button type="submit" class="primary-btn">Create account</button>
          </div>
        </form>

        <div class="auth-switch">
          <span id="switch-to-signup-wrap">
            New here? <button type="button" id="switch-to-signup">Create an account</button>
          </span>
          <span id="switch-to-login-wrap" class="hidden">
            Already have an account? <button type="button" id="switch-to-login">Sign in</button>
          </span>
        </div>
      </div>
    </div>

    <div id="app" class="app">
      <div class="topbar">
        <div class="topbar-left">
          <div class="brand-mini">
            <div class="brand-mark" aria-hidden="true">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
            JOIN<span class="accent">365</span>
          </div>
        </div>

        <div class="topbar-right">
          <button class="topbar-btn" id="new-project-btn" type="button">+ New project</button>
          <button class="topbar-btn" id="sign-out-btn" type="button">Sign out</button>
        </div>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-title">Projects</div>
            <div id="project-list" class="project-list"></div>
          </div>
        </aside>

        <main class="content">
          <div id="stats" class="stats">
            <div class="stat">
              <div class="label">Total runtime</div>
              <div id="runtime-total" class="value">0m</div>
            </div>
            <div class="stat">
              <div class="label">Scenes</div>
              <div id="scene-total" class="value">0</div>
            </div>
            <div class="stat">
              <div class="label">Drafts</div>
              <div id="draft-total" class="value">0</div>
            </div>
            <div class="stat">
              <div class="label">Render status</div>
              <div id="render-status" class="value">Ready</div>
            </div>
          </div>

          <div class="workspace">
            <div class="panel">
              <div class="project-form">
                <div class="row">
                  <div>
                    <label for="project-title">Project title</label>
                    <input id="project-title" type="text" placeholder="Untitled video" />
                  </div>
                  <div>
                    <label for="project-category">Category</label>
                    <select id="project-category">
                      <option value="Tutorial">Tutorial</option>
                      <option value="Podcast">Podcast</option>
                      <option value="Interview">Interview</option>
                      <option value="Product">Product</option>
                      <option value="Documentary">Documentary</option>
                      <option value="Lifestyle">Lifestyle</option>
                      <option value="Vlog">Vlog</option>
                    </select>
                  </div>
                </div>

                <div class="row">
                  <div>
                    <label for="project-format">Format</label>
                    <select id="project-format">
                      <option value="16:9">16:9</option>
                      <option value="9:16">9:16</option>
                      <option value="1:1">1:1</option>
                    </select>
                  </div>

                  <div>
                    <label for="project-duration">Duration</label>
                    <div class="range-row">
                      <input id="project-duration" type="range" min="1" max="30" value="8" />
                      <div id="project-duration-value" class="range-value">8m</div>
                    </div>
                  </div>
                </div>

                <div>
                  <label for="project-script">Script</label>
                  <textarea id="project-script" placeholder="Paste your script or outline here..."></textarea>
                </div>

                <div>
                  <label for="project-voice">Voice profile</label>
                  <select id="project-voice">
                    <option value="Narration">Narration</option>
                    <option value="Warm">Warm</option>
                    <option value="Energetic">Energetic</option>
                    <option value="Cinematic">Cinematic</option>
                    <option value="Calm">Calm</option>
                  </select>
                </div>

                <div>
                  <label for="project-cover">Cover image</label>
                  <input id="project-cover" type="file" accept="image/*" />
                </div>

                <div class="row">
                  <div>
                    <button type="button" id="save-project-btn" class="secondary-btn">Save draft</button>
                  </div>
                  <div>
                    <button type="button" id="generate-plan-btn" class="primary-btn">Generate video plan</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="panel">
              <div class="panel-header">
                <h3>Render queue</h3>
              </div>

              <div class="render-box">
                <div class="progress-wrap">
                  <div id="render-progress" class="progress-bar"></div>
                </div>

                <div id="render-status-text" class="progress-status">Ready to generate</div>

                <button id="render-btn" type="button" class="primary-btn">Start render</button>
              </div>

              <div class="panel-header" style="margin-top: 18px;">
                <h3>Video timeline</h3>
              </div>

              <div id="timeline" class="timeline"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAOld48eda9m_rIJ_72wnMVUyJM1unDlzA",
      authDomain: "join365-9a175.firebaseapp.com",
      databaseURL: "https://join365-9a175-default-rtdb.firebaseio.com/",
      projectId: "join365-9a175",
      storageBucket: "join365-9a175.firebasestorage.app",
      messagingSenderId: "624922796690",
      appId: "1:624922796690:web:2ca60637523e4aadcb3c4b",
      measurementId: "G-3FKMNX91SH"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    const state = {
      uid: null,
      projects: [],
      currentProjectId: null,
      renderTimer: null
    };

    const els = {
      authScreen: document.getElementById('auth-screen'),
      app: document.getElementById('app'),
      loginForm: document.getElementById('login-form'),
      signupForm: document.getElementById('signup-form'),
      authError: document.getElementById('auth-error'),
      projectList: document.getElementById('project-list'),
      runtimeTotal: document.getElementById('runtime-total'),
      sceneTotal: document.getElementById('scene-total'),
      draftTotal: document.getElementById('draft-total'),
      renderStatus: document.getElementById('render-status'),
      projectTitle: document.getElementById('project-title'),
      projectCategory: document.getElementById('project-category'),
      projectFormat: document.getElementById('project-format'),
      projectDuration: document.getElementById('project-duration'),
      projectDurationValue: document.getElementById('project-duration-value'),
      projectScript: document.getElementById('project-script'),
      projectVoice: document.getElementById('project-voice'),
      projectCover: document.getElementById('project-cover'),
      saveProjectBtn: document.getElementById('save-project-btn'),
      generatePlanBtn: document.getElementById('generate-plan-btn'),
      renderBtn: document.getElementById('render-btn'),
      renderProgress: document.getElementById('render-progress'),
      renderStatusText: document.getElementById('render-status-text'),
      timeline: document.getElementById('timeline')
    };

    auth.setPersistence(firebase.auth.Auth.Persistence.NONE).catch(() => {});

    function showError(msg) {
      els.authError.textContent = msg;
      els.authError.style.display = 'block';
    }

    function clearError() {
      els.authError.textContent = '';
      els.authError.style.display = 'none';
    }

    function safeId() {
      return db.ref('studio').push().key;
    }

    function durationLabel(minutes) {
      return `${minutes}m`;
    }

    function toArray(obj) {
      return obj ? Object.keys(obj).map(key => ({ id: key, ...obj[key] })) : [];
    }

    function createSceneList(scriptText, durationMinutes) {
      const text = (scriptText || '').trim();
      if (!text) return [];

      const paragraphs = text.split(/\n+/).filter(Boolean);
      const scenes = [];

      for (let i = 0; i < paragraphs.length; i++) {
        const p = paragraphs[i];
        const cleaned = p.replace(/\s+/g, ' ').trim();
        const words = cleaned.split(/\s+/).length;
        const perMinute = 150;
        const estimatedSeconds = Math.min(Math.max(Math.round((words / perMinute) * 60), 10), 60);
        const sceneSeconds = Math.min(Math.round((estimatedSeconds * durationMinutes) / Math.max(paragraphs.length, 1)), 60);
        scenes.push({
          title: `Scene ${i + 1}`,
          text: cleaned,
          duration: Math.max(8, Math.min(sceneSeconds, 45))
        });
      }

      return scenes;
    }

    function currentProject() {
      return state.projects.find(p => p.id === state.currentProjectId) || null;
    }

    function setProjectForm(project) {
      const p = project || {
        title: '',
        category: 'Tutorial',
        format: '16:9',
        duration: 8,
        script: '',
        voice: 'Narration'
      };

      els.projectTitle.value = p.title || '';
      els.projectCategory.value = p.category || 'Tutorial';
      els.projectFormat.value = p.format || '16:9';
      els.projectDuration.value = p.duration || 8;
      els.projectDurationValue.textContent = durationLabel(p.duration || 8);
      els.projectScript.value = p.script || '';
      els.projectVoice.value = p.voice || 'Narration';
    }

    function renderStats() {
      const totalRuntime = state.projects.reduce((sum, p) => sum + Number(p.duration || 0), 0);
      const totalScenes = state.projects.reduce((sum, p) => sum + Number(p.scenes ? p.scenes.length : 0), 0);
      const draftCount = state.projects.length;

      els.runtimeTotal.textContent = `${totalRuntime}m`;
      els.sceneTotal.textContent = String(totalScenes);
      els.draftTotal.textContent = String(draftCount);
      els.renderStatus.textContent = state.projects.some(p => p.status === 'rendering') ? 'Processing' : 'Ready';
    }

    function renderProjectList() {
      const list = els.projectList;
      list.innerHTML = '';

      if (!state.projects.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No projects yet. Create your first one.';
        list.appendChild(empty);
        return;
      }

      state.projects.forEach(project => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'project-item' + (project.id === state.currentProjectId ? ' active' : '');
        item.innerHTML = `
          <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${project.title || 'Untitled video'}</div>
          <div class="project-meta">${project.category || 'General'} • ${project.duration || 0}m</div>
        `;
        item.addEventListener('click', () => selectProject(project.id));
        list.appendChild(item);
      });
    }

    function selectProject(id) {
      state.currentProjectId = id;
      const project = currentProject();
      if (!project) return;

      renderProjectList();
      setProjectForm(project);
      renderTimeline(project.scenes || []);
      updateRenderStatus(project.status || 'ready', project.progress || 0);
    }

    function renderTimeline(scenes) {
      const container = els.timeline;
      container.innerHTML = '';

      if (!scenes.length) {
        container.innerHTML = '<div class=\"empty-state\">Generate a video plan to see scenes.</div>';
        return;
      }

      scenes.forEach((scene, index) => {
        const el = document.createElement('div');
        el.className = 'scene';
        el.innerHTML = `
          <div class="scene-index">${index + 1}</div>
          <div class="scene-main">
            <div class="scene-title">${scene.title || `Scene ${index + 1}`}</div>
            <div class="scene-text" style="color:var(--muted);font-size:12px;line-height:1.5;">${(scene.text || '').slice(0, 140)}</div>
            <div class="scene-time">${scene.duration || 0}s</div>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function saveProjectToDatabase(project) {
      if (!state.uid) return Promise.resolve();

      const ref = db.ref(`users/${state.uid}/studio/projects/${project.id}`);
      return ref.set(project);
    }

    function saveCurrentProject() {
      const project = {
        id: state.currentProjectId || safeId(),
        title: els.projectTitle.value.trim() || 'Untitled video',
        category: els.projectCategory.value,
        format: els.projectFormat.value,
        duration: Number(els.projectDuration.value || 8),
        script: els.projectScript.value.trim(),
        voice: els.projectVoice.value,
        updatedAt: Date.now(),
        status: 'ready',
        progress: 0
      };

      if (!state.currentProjectId) {
        state.currentProjectId = project.id;
      }

      const scenes = createSceneList(project.script, project.duration);
      project.scenes = scenes;

      const ref = db.ref(`users/${state.uid}/studio/projects/${project.id}`);
      return ref.set(project).then(() => {
        loadProjects();
      });
    }

    function generatePlan() {
      const title = els.projectTitle.value.trim() || 'Untitled video';
      const script = els.projectScript.value.trim();
      const duration = Number(els.projectDuration.value || 8);

      if (!script) {
        alert('Add a script or outline before generating a plan.');
        return;
      }

      const scenes = createSceneList(script, duration);

      const project = {
        id: state.currentProjectId || safeId(),
        title,
        category: els.projectCategory.value,
        format: els.projectFormat.value,
        duration,
        script,
        voice: els.projectVoice.value,
        status: 'ready',
        progress: 0,
        scenes,
        updatedAt: Date.now()
      };

      state.currentProjectId = project.id;

      const ref = db.ref(`users/${state.uid}/studio/projects/${project.id}`);
      ref.set(project).then(() => {
        loadProjects();
        selectProject(project.id);
      });
    }

    function updateRenderStatus(status, progress) {
      const project = currentProject();
      const p = project || { status: 'ready', progress: 0 };

      if (status === 'rendering') {
        els.renderStatusText.textContent = 'Rendering...';
      } else if (status === 'ready') {
        els.renderStatusText.textContent = 'Ready to generate';
      } else if (status === 'queued') {
        els.renderStatusText.textContent = 'Queued';
      } else if (status === 'done') {
        els.renderStatusText.textContent = 'Render finished';
      }

      els.renderProgress.style.width = `${Math.min(100, Math.max(0, Number(progress || 0))) }%`;

      if (project && project.id) {
        const ref = db.ref(`users/${state.uid}/studio/projects/${project.id}`);
        ref.update({ status, progress });
      }
    }

    function startRender() {
      const project = currentProject();
      if (!project) {
        alert('Create or select a project first.');
        return;
      }

      if (project.status === 'rendering') {
        alert('Render already in progress.');
        return;
      }

      const renderState = {
        status: 'rendering',
        progress: 0
      };

      const ref = db.ref(`users/${state.uid}/studio/projects/${project.id}`);
      ref.update(renderState).then(() => {
        loadProjects();
        selectProject(project.id);

        const progress = (step) => {
          const projectRef = db.ref(`users/${state.uid}/studio/projects/${project.id}`);
          projectRef.update({
            status: 'rendering',
            progress: step
          }).then(() => {
            if (step >= 100) {
              projectRef.update({
                status: 'done',
                progress: 100
              }).then(() => {
                loadProjects();
                selectProject(project.id);
              });
            }
          });
        };

        let step = 0;
        const timer = setInterval(() => {
          step += 10;
          if (step >= 100) {
            clearInterval(timer);
            progress(100);
          } else {
            progress(step);
          }
        }, 600);
      });
    }

    function loadProjects() {
      if (!state.uid) return;

      const projectsRef = db.ref(`users/${state.uid}/studio/projects`);
      projectsRef.on('value', snap => {
        const data = snap.val() || {};
        state.projects = toArray(data).sort((a, b) => (a.updatedAt || 0) - (b.updatedAt || 0));
        renderProjectList();
        renderStats();

        if (!state.currentProjectId && state.projects.length) {
          state.currentProjectId = state.projects[0].id;
          selectProject(state.currentProjectId);
        } else if (state.currentProjectId && !state.projects.find(p => p.id === state.currentProjectId)) {
          state.currentProjectId = null;
          setProjectForm();
          renderTimeline([]);
        }
      });
    }

    function setupAuthModes() {
      document.getElementById('switch-to-signup').addEventListener('click', () => {
        clearError();
        document.getElementById('signup-form').classList.remove('hidden');
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('switch-to-login-wrap').classList.remove('hidden');
        document.getElementById('switch-to-signup-wrap').classList.add('hidden');
      });

      document.getElementById('switch-to-login').addEventListener('click', () => {
        clearError();
        document.getElementById('signup-form').classList.add('hidden');
        document.getElementById('login-form').classList.remove('hidden');
        document.getElementById('switch-to-login-wrap').classList.add('hidden');
        document.getElementById('switch-to-signup-wrap').classList.remove('hidden');
      });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
          showError('Enter your email and password.');
          return;
        }

        try {
          await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          showError(err.message || 'Something went wrong.');
        }
      });

      document.getElementById('signup-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();

        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;

        if (!name || !email || !password) {
          showError('Enter your name, email, and password.');
          return;
        }

        try {
          const cred = await auth.createUserWithEmailAndPassword(email, password);
          await db.ref(`users/${cred.user.uid}/profile`).set({
            name,
            email,
            createdAt: Date.now()
          });
        } catch (err) {
          showError(err.message || 'Something went wrong.');
        }
      });
    }

    function init() {
      setupAuthModes();

      document.getElementById('new-project-btn').addEventListener('click', () => {
        state.currentProjectId = null;
        setProjectForm();
        renderTimeline([]);
      });

      document.getElementById('save-project-btn').addEventListener('click', () => {
        if (!state.uid) return;
        saveCurrentProject();
      });

      document.getElementById('generate-plan-btn').addEventListener('click', () => {
        if (!state.uid) return;
        generatePlan();
      });

      document.getElementById('render-btn').addEventListener('click', () => {
        if (!state.uid) return;
        startRender();
      });

      document.getElementById('project-duration').addEventListener('input', (e) => {
        const value = Number(e.target.value);
        els.projectDurationValue.textContent = durationLabel(value);
      });

      document.getElementById('sign-out-btn').addEventListener('click', () => {
        auth.signOut();
      });

      auth.onAuthStateChanged(user => {
        if (user) {
          state.uid = user.uid;
          document.getElementById('auth-screen').classList.add('hidden');
          document.getElementById('app').classList.add('active');
          loadProjects();
        } else {
          state.uid = null;
          state.currentProjectId = null;
          state.projects = [];
          setProjectForm();
          renderTimeline([]);
          document.getElementById('auth-screen').classList.remove('hidden');
          document.getElementById('app').classList.remove('active');
        }
      });
    }

    init();
  </script>
</body>
</html>

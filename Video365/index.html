<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join365 Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d14;
      --bg-2: #101826;
      --panel: #121d2d;
      --panel-2: #18263a;
      --line: #2b3b50;
      --line-soft: rgba(255,255,255,0.06);
      --text: #edf3ff;
      --muted: #a7b4c7;
      --faint: #73839b;
      --orange: #ff6b47;
      --teal: #2dd4bf;
      --gold: #e8a93b;
      --violet: #a78bfa;
      --blue: #60a5fa;
      --danger: #f87171;
      --success: #34d399;
      --shadow: 0 20px 50px rgba(0,0,0,.45);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Inter", system-ui, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(255,107,71,0.18), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(97,170,255,0.12), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    a { color: inherit; text-decoration: none; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .hidden { display: none !important; }

    .shell {
      position: relative;
      min-height: 100vh;
    }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(5,8,13,.55);
    }

    .auth-card {
      width: min(420px, 100%);
      background: rgba(18,29,45,.96);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 28px 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      letter-spacing: -0.04em;
      font-size: 22px;
    }

    .brand-mark {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 22px;
      margin-right: 2px;
    }

    .brand-mark i {
      display: block;
      width: 3px;
      border-radius: 2px;
      background: var(--orange);
    }

    .brand-mark i:nth-child(1) { height: 40%; }
    .brand-mark i:nth-child(2) { height: 100%; }
    .brand-mark i:nth-child(3) { height: 65%; }
    .brand-mark i:nth-child(4) { height: 100%; }
    .brand-mark i:nth-child(5) { height: 30%; }

    .brand span { color: var(--orange); }

    .tagline {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 18px;
    }

    .field { margin-bottom: 14px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--text);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: rgba(255,107,71,.7);
      box-shadow: 0 0 0 3px rgba(255,107,71,.12);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .auth-actions { margin-top: 10px; }
    .primary-btn, .secondary-btn, .ghost-btn {
      border: 1px solid transparent;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 700;
      transition: .16s ease;
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--orange), #ff7d58);
      color: #1c120c;
      border-color: rgba(255,255,255,.08);
    }

    .primary-btn:hover { filter: brightness(1.08); }
    .secondary-btn {
      background: rgba(255,255,255,.04);
      color: var(--text);
      border-color: var(--line);
    }
    .ghost-btn {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .auth-switch {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .auth-switch button {
      border: none;
      background: none;
      color: var(--orange);
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    .auth-error {
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.5);
      color: #ffc9c9;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none;
    }

    .app {
      display: none;
      min-height: 100vh;
      background: rgba(7,11,17,.7);
    }

    .app.active { display: block; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: rgba(16,24,38,.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      letter-spacing: -0.045em;
      font-size: 18px;
    }

    .brand-mini .accent { color: var(--orange); }

    .topbar-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: calc(100vh - 77px);
    }

    .sidebar {
      background: rgba(15,22,31,.94);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
    }

    .sidebar-section {
      margin-bottom: 18px;
    }

    .sidebar-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--faint);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .project-item {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      border-radius: 12px;
      padding: 10px 12px;
      color: var(--text);
      text-align: left;
      transition: .15s ease;
    }

    .project-item.active {
      border-color: rgba(255,107,71,.7);
      background: rgba(255,107,71,.08);
    }

    .project-item:hover {
      background: rgba(255,255,255,.04);
    }

    .project-meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
    }

    .content {
      padding: 24px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .stat {
      background: rgba(255,255,255,.02);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
    }

    .stat .label {
      display: block;
      color: var(--faint);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    .stat .value {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.06em;
      font-family: "Space Grotesk", sans-serif;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 18px;
      align-items: start;
    }

    .panel {
      background: rgba(255,255,255,.02);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
    }

    .panel h3 {
      margin: 0 0 16px;
      font-family: "Space Grotesk", sans-serif;
      font-size: 18px;
      letter-spacing: -.03em;
    }

    .project-form {
      display: grid;
      gap: 14px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .range-row input[type="range"] {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: none;
      background: transparent;
      box-shadow: none;
    }

    .range-value {
      min-width: 52px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }

    .scene {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.02);
      border-radius: 12px;
    }

    .scene-index {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255,107,71,.08);
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
    }

    .scene-main {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .scene-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scene-time {
      color: var(--muted);
      font-size: 12px;
    }

    .render-box {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-wrap {
      height: 12px;
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(135deg, var(--orange), var(--teal));
      transition: width .3s ease;
    }

    .progress-status {
      color: var(--muted);
      font-size: 12px;
      min-height: 18px;
    }

    .empty-state {
      color: var(--muted);
      padding: 18px 12px;
      border: 1px dashed var(--line);
      border-radius: 12px;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .workspace { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, minmax(140px, 1fr)); }
    }

    @media (max-width: 620px) {
      .stats { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="auth-screen" class="auth-screen">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i>
          </div>

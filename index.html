<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111216">
    <title>Join365 — Your digital workspace</title>
    <style>
        :root {
            --gold: #f2c744;
            --gold-light: #ffda67;
            --cream: #fffaf0;
            --muted: #aaa7b0;
            --background: #111216;
            --cube-size: min(58vw, 230px);
            --half-cube: min(29vw, 115px);
            --panel-size: clamp(58px, 17vw, 92px);
            --panel-gap: clamp(5px, 1vw, 10px);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--cream);
            background-color: var(--background);
            background-image:
                radial-gradient(circle at 50% 45%, rgba(110, 86, 188, 0.24), transparent 34%),
                radial-gradient(circle at 8% 92%, rgba(242, 199, 68, 0.12), transparent 28%),
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: auto, auto, 72px 72px, 72px 72px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .page {
            position: relative;
            display: flex;
            width: 100%;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 44px 20px 34px;
            text-align: center;
        }

        .page::before,
        .page::after {
            position: fixed;
            z-index: 0;
            width: 420px;
            height: 420px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        .page::before {
            top: -255px;
            right: -210px;
        }

        .page::after {
            bottom: -275px;
            left: -210px;
            border-color: rgba(242, 199, 68, 0.11);
        }

        .intro,
        .logo-stage,
        .tagline,
        .enter-button,
        .hint {
            position: relative;
            z-index: 1;
        }

        .intro {
            max-width: 780px;
            animation: enter 700ms ease-out both;
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 18px;
            color: var(--gold-light);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: var(--cream);
            font-size: clamp(36px, 6vw, 72px);
            font-weight: 700;
            letter-spacing: -0.055em;
            line-height: 0.98;
        }

        h1 span {
            color: var(--gold);
        }

        .logo-stage {
            position: relative;
            width: min(100%, 500px);
            height: clamp(300px, 40vh, 390px);
            margin-top: 17px;
            perspective: 1000px;
            animation: enter 800ms 100ms ease-out both;
        }

        .logo-stage::before {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(72vw, 330px);
            height: min(35vw, 165px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            content: "";
            pointer-events: none;
            transform: translate(-50%, -50%) rotate(-12deg);
        }

        .logo-button {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            outline: 0;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .logo-button:focus-visible::after {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(76vw, 360px);
            height: min(43vw, 205px);
            border: 2px solid var(--gold);
            border-radius: 50%;
            content: "";
            transform: translate(-50%, -50%) rotate(-12deg);
        }

        .visual {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }

        /* The two wrappers separate the cube's spin from its floating motion. */
        .cube-float {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--cube-size);
            height: var(--cube-size);
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            animation: float 3.6s ease-in-out infinite;
        }

        .cube {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: spin 12s linear infinite;
            filter: drop-shadow(0 24px 19px rgba(0, 0, 0, 0.4));
        }

        .logo-button:hover .cube {
            animation-duration: 7s;
        }

        .cube-face {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 20px;
            background: var(--gold);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
            backface-visibility: hidden;
        }

        .cube-face::after,
        .panel-face::after {
            position: absolute;
            inset: 0;
            content: "";
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.35), transparent 35%, rgba(0, 0, 0, 0.1));
            mix-blend-mode: soft-light;
        }

        .cube-face img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .face-front { transform: translateZ(var(--half-cube)); }
        .face-back { transform: rotateY(180deg) translateZ(var(--half-cube)); }
        .face-right { transform: rotateY(90deg) translateZ(var(--half-cube)); }
        .face-left { transform: rotateY(-90deg) translateZ(var(--half-cube)); }
        .face-top { transform: rotateX(90deg) translateZ(var(--half-cube)); }
        .face-bottom { transform: rotateX(-90deg) translateZ(var(--half-cube)); }

        .cube-shadow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            width: min(36vw, 155px);
            height: 22px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.48);
            filter: blur(14px);
            transform: translateX(-50%);
            animation: shadow 3.6s ease-in-out infinite;
        }

        /* Six panels appear in a clean 3 by 2 layout after the cube opens. */
        .panels {
            position: absolute;
            top: 50%;
            left: 50%;
            display: grid;
            width: calc(var(--panel-size) * 3 + var(--panel-gap) * 2);
            height: calc(var(--panel-size) * 2 + var(--panel-gap));
            grid-template-columns: repeat(3, var(--panel-size));
            grid-template-rows: repeat(2, var(--panel-size));
            gap: var(--panel-gap);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.18);
            transform-style: preserve-3d;
            transition: opacity 250ms ease 400ms, transform 650ms cubic-bezier(0.2, 0.8, 0.2, 1) 400ms;
        }

        .panel {
            width: var(--panel-size);
            height: var(--panel-size);
            perspective: 700px;
            opacity: 0;
            transform: scale(0.2) rotate(24deg) translateY(22px);
            transition: opacity 300ms ease var(--delay), transform 650ms cubic-bezier(0.2, 0.85, 0.2, 1) var(--delay);
        }

        .panel-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: none;
        }

        .panel-face {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.52);
            border-radius: 13px;
            background-color: var(--gold);
            backface-visibility: hidden;
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.3), inset 0 0 0 1px rgba(0, 0, 0, 0.1);
        }

        .panel-front {
            background-image: url("logo.png");
            background-repeat: no-repeat;
            background-size: 300% 200%;
        }

        .panel-back {
            color: var(--gold);
            background: linear-gradient(135deg, #312942, #15151c);
            font-size: clamp(16px, 4vw, 25px);
            font-weight: 800;
            letter-spacing: -0.08em;
            transform: rotateY(180deg);
        }

        .panel-1 .panel-front { background-position: 0 0; }
        .panel-2 .panel-front { background-position: 50% 0; }
        .panel-3 .panel-front { background-position: 100% 0; }
        .panel-4 .panel-front { background-position: 0 100%; }
        .panel-5 .panel-front { background-position: 50% 100%; }
        .panel-6 .panel-front { background-position: 100% 100%; }

        .panel-1 { --delay: 40ms; --flip-delay: -1.1s; grid-column: 1; grid-row: 1; }
        .panel-2 { --delay: 110ms; --flip-delay: -1.9s; grid-column: 2; grid-row: 1; }
        .panel-3 { --delay: 180ms; --flip-delay: -2.7s; grid-column: 3; grid-row: 1; }
        .panel-4 { --delay: 250ms; --flip-delay: -3.5s; grid-column: 1; grid-row: 2; }
        .panel-5 { --delay: 320ms; --flip-delay: -4.3s; grid-column: 2; grid-row: 2; }
        .panel-6 { --delay: 390ms; --flip-delay: -5.1s; grid-column: 3; grid-row: 2; }

        .logo-stage.is-open .cube-float {
            animation: cube-exit 800ms cubic-bezier(0.45, 0, 0.15, 1) forwards;
        }

        .logo-stage.is-open .cube {
            animation-play-state: paused;
        }

        .logo-stage.is-open .cube-shadow {
            opacity: 0;
            transform: translateX(-50%) scale(0.3);
            transition: opacity 400ms ease, transform 500ms ease;
        }

        .logo-stage.is-open .panels {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .logo-stage.is-open .panel {
            opacity: 1;
            transform: scale(1) rotate(0) translateY(0);
        }

        .logo-stage.is-open .panel-inner {
            animation: slideshow-flip 6.4s var(--flip-delay) ease-in-out infinite;
        }

        .logo-stage.is-open .panel:hover {
            transform: scale(1.06) translateY(-6px) rotate(-2deg);
            transition-duration: 180ms;
        }

        .tagline {
            margin: 0;
            color: var(--muted);
            font-size: clamp(17px, 2.5vw, 23px);
            font-weight: normal;
            letter-spacing: -0.02em;
            animation: enter 700ms 180ms ease-out both;
        }

        .tagline span {
            color: var(--gold-light);
        }

        .enter-button {
            display: inline-flex;
            align-items: center;
            gap: 13px;
            margin-top: 24px;
            padding: 14px 18px 14px 23px;
            border: 1px solid rgba(255, 255, 255, 0.17);
            border-radius: 99px;
            color: #18171b;
            background: var(--gold);
            box-shadow: 0 14px 30px rgba(242, 199, 68, 0.17);
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
            animation: enter 700ms 240ms ease-out both;
        }

        .enter-button::after {
            display: grid;
            width: 27px;
            height: 27px;
            place-items: center;
            border-radius: 50%;
            color: var(--gold);
            background: #18171b;
            content: "↗";
            font-size: 17px;
            transition: transform 180ms ease;
        }

        .enter-button:hover,
        .enter-button:focus-visible {
            background: var(--gold-light);
            box-shadow: 0 18px 38px rgba(242, 199, 68, 0.3);
            transform: translateY(-3px);
        }

        .enter-button:hover::after,
        .enter-button:focus-visible::after {
            transform: translate(2px, -2px);
        }

        .enter-button:focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 4px;
        }

        .hint {
            margin: 16px 0 0;
            color: #77747e;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            animation: enter 700ms 300ms ease-out both;
        }

        .hint::before {
            margin-right: 7px;
            color: var(--gold);
            content: "✦";
        }

        @keyframes spin {
            from { transform: rotateX(-16deg) rotateY(0deg) rotateZ(1deg); }
            to { transform: rotateX(-16deg) rotateY(360deg) rotateZ(1deg); }
        }

        @keyframes float {
            0%, 100% { transform: translate(-50%, calc(-50% + 8px)); }
            50% { transform: translate(-50%, calc(-50% - 10px)); }
        }

        @keyframes cube-exit {
            0% { opacity: 1; transform: translate(-50%, calc(-50% - 8px)) scale(1) rotate(0deg); }
            45% { opacity: 1; transform: translate(-50%, -50%) scale(1.08) rotate(14deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.08) rotate(180deg); }
        }

        @keyframes shadow {
            0%, 100% { opacity: 0.48; transform: translateX(-50%) scale(0.82); }
            50% { opacity: 0.28; transform: translateX(-50%) scale(1.08); }
        }

        @keyframes slideshow-flip {
            0%, 24% { transform: rotateY(0deg) rotateX(0deg); }
            38%, 67% { transform: rotateY(180deg) rotateX(3deg); }
            81%, 100% { transform: rotateY(360deg) rotateX(0deg); }
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-height: 700px) {
            .page {
                justify-content: flex-start;
                padding-top: 25px;
            }

            .logo-stage {
                height: 270px;
                margin-top: 7px;
            }

            .enter-button {
                margin-top: 15px;
            }
        }

        @media (max-width: 430px) {
            :root {
                --cube-size: 190px;
                --half-cube: 95px;
            }

            .page {
                padding-right: 14px;
                padding-left: 14px;
            }

            .eyebrow {
                font-size: 9px;
                letter-spacing: 0.18em;
            }

            .logo-stage {
                height: 285px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.001ms !important;
            }

            .cube {
                transform: rotateX(-16deg) rotateY(-28deg) rotateZ(1deg) !important;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="intro">
            <p class="eyebrow">Join365 / Digital workspace</p>
            <h1>Welcome to Join365. <span>Your digital workspace</span></h1>
        </header>

        <section class="logo-stage" id="logoStage" aria-label="Interactive Join365 logo">
            <button class="logo-button" id="logoButton" type="button" aria-pressed="false" aria-label="Open the Join365 cube">
                <span class="visual" aria-hidden="true">
                    <span class="cube-float">
                        <span class="cube">
                            <span class="cube-face face-front"><img src="logo.png" alt=""></span>
                            <span class="cube-face face-back"><img src="logo.png" alt=""></span>
                            <span class="cube-face face-right"><img src="logo.png" alt=""></span>
                            <span class="cube-face face-left"><img src="logo.png" alt=""></span>
                            <span class="cube-face face-top"><img src="logo.png" alt=""></span>
                            <span class="cube-face face-bottom"><img src="logo.png" alt=""></span>
                        </span>
                    </span>
                    <span class="cube-shadow"></span>

                    <span class="panels">
                        <span class="panel panel-1">
                            <span class="panel-inner">
                                <span class="panel-face panel-front"></span>
                                <span class="panel-face panel-back">J</span>
                            </span>
                        </span>
                        <span class="panel panel-2">
                            <span class="panel-inner">
                                <span class="panel-face panel-front"></span>
                                <span class="panel-face panel-back">O</span>
                            </span>
                        </span>
                        <span class="panel panel-3">
                            <span class="panel-inner">
                                <span class="panel-face panel-front"></span>
                                <span class="panel-face panel-back">I</span>
                            </span>
                        </span>
                        <span class="panel panel-4">
                            <span class="panel-inner">
                                <span class="panel-face panel-front"></span>
                                <span class="panel-face panel-back">N</span>
                            </span>
                        </span>
                        <span class="panel panel-5">
                            <span class="panel-inner">
                                <span class="panel-face panel-front"></span>
                                <span class="panel-face panel-back">3</span>
                            </span>
                        </span>
                        <span class="panel panel-6">
                            <span class="panel-inner">
                                <span class="panel-face panel-front"></span>
                                <span class="panel-face panel-back">65</span>
                            </span>
                        </span>
                    </span>
                </span>
            </button>
        </section>

        <p class="tagline">Everything you need. <span>One place</span></p>
        <a class="enter-button" href="https://join365.eu.cc/Tools">Enter the site</a>
        <p class="hint" id="hint">Click the cube to unfold it</p>
    </main>

    <script>
        (function () {
            var stage = document.getElementById("logoStage");
            var button = document.getElementById("logoButton");
            var hint = document.getElementById("hint");

            button.addEventListener("click", function () {
                var isOpen = stage.classList.toggle("is-open");
                button.setAttribute("aria-pressed", String(isOpen));
                button.setAttribute(
                    "aria-label",
                    isOpen
                        ? "Close the six Join365 squares and return to the cube"
                        : "Open the Join365 cube"
                );
                hint.textContent = isOpen
                    ? "Click the squares to rebuild the cube"
                    : "Click the cube to unfold it";
            });
        }());
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111216">
    <title>Join365 — Your digital workspace</title>
    <style>
        :root {
            --yellow: #f3c644;
            --yellow-bright: #ffdb69;
            --white: #fffaf0;
            --muted: #a5a2ac;
            --black: #111216;
            --cube-size: 220px;
            --cube-depth: 110px;
            --tile-size: 88px;
            --tile-gap: 8px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--white);
            background:
                radial-gradient(circle at 50% 40%, rgba(91, 69, 161, 0.22), transparent 34%),
                radial-gradient(circle at 8% 95%, rgba(243, 198, 68, 0.12), transparent 27%),
                #111216;
            font-family: Arial, Helvetica, sans-serif;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            content: "";
            opacity: 0.35;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 72px 72px;
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 42px 18px 32px;
            text-align: center;
        }

        .intro {
            animation: appear 650ms ease-out both;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--yellow-bright);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.24em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 760px;
            margin: 0;
            color: var(--white);
            font-size: clamp(36px, 6vw, 72px);
            font-weight: 700;
            letter-spacing: -0.06em;
            line-height: 0.98;
        }

        h1 em {
            color: var(--yellow);
            font-style: normal;
        }

        .logo-stage {
            position: relative;
            width: min(100%, 500px);
            height: 350px;
            margin-top: 16px;
            perspective: 1000px;
            animation: appear 700ms 100ms ease-out both;
        }

        .logo-stage::before {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 330px;
            height: 170px;
            border: 1px solid rgba(255, 255, 255, 0.11);
            border-radius: 50%;
            content: "";
            pointer-events: none;
            transform: translate(-50%, -50%) rotate(-12deg);
        }

        .logo-trigger {
            position: absolute;
            inset: 0;
            z-index: 5;
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .logo-trigger:focus-visible::after {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 330px;
            height: 180px;
            border: 2px solid var(--yellow);
            border-radius: 50%;
            content: "";
            transform: translate(-50%, -50%) rotate(-12deg);
        }

        .animation-space {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
        }

        /* A separate wrapper handles the up-and-down movement. */
        .cube-bob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--cube-size);
            height: var(--cube-size);
            transform: translate(-50%, -50%);
            transform-style: preserve-3d;
            animation: bob 3.4s ease-in-out infinite;
        }

        /* The cube itself spins on both its X and Y axes. */
        .cube {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate-cube 12s linear infinite;
            filter: drop-shadow(0 24px 20px rgba(0, 0, 0, 0.42));
        }

        .logo-trigger:hover .cube {
            animation-duration: 7s;
        }

        .cube-face {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.48);
            border-radius: 22px;
            background: var(--yellow);
            backface-visibility: hidden;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
        }

        .cube-face img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cube-face::after,
        .tile-face::after {
            position: absolute;
            inset: 0;
            content: "";
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.32), transparent 38%, rgba(0, 0, 0, 0.13));
            mix-blend-mode: soft-light;
        }

        .front { transform: translateZ(var(--cube-depth)); }
        .back { transform: rotateY(180deg) translateZ(var(--cube-depth)); }
        .right { transform: rotateY(90deg) translateZ(var(--cube-depth)); }
        .left { transform: rotateY(-90deg) translateZ(var(--cube-depth)); }
        .top { transform: rotateX(90deg) translateZ(var(--cube-depth)); }
        .bottom { transform: rotateX(-90deg) translateZ(var(--cube-depth)); }

        .cube-shadow {
            position: absolute;
            bottom: 27px;
            left: 50%;
            width: 145px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            filter: blur(14px);
            transform: translateX(-50%);
            animation: shadow 3.4s ease-in-out infinite;
        }

        /* This layer is hidden until the cube is clicked. */
        .tiles {
            position: absolute;
            top: 50%;
            left: 50%;
            display: grid;
            width: calc(var(--tile-size) * 3 + var(--tile-gap) * 2);
            height: calc(var(--tile-size) * 2 + var(--tile-gap));
            grid-template-columns: repeat(3, var(--tile-size));
            grid-template-rows: repeat(2, var(--tile-size));
            gap: var(--tile-gap);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.25);
            transition: opacity 250ms ease 350ms, transform 700ms cubic-bezier(0.2, 0.85, 0.2, 1) 350ms;
        }

        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            perspective: 700px;
            opacity: 0;
            transform: scale(0.15) rotate(22deg) translateY(20px);
            transition: opacity 320ms ease var(--delay), transform 700ms cubic-bezier(0.2, 0.85, 0.2, 1) var(--delay);
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .tile-face {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.48);
            border-radius: 13px;
            background: var(--yellow);
            backface-visibility: hidden;
            box-shadow: 0 14px 26px rgba(0, 0, 0, 0.28);
        }

        .tile-front {
            background-image: url("./logo.png");
            background-position: center;
            background-size: cover;
        }

        .tile-back {
            color: var(--yellow);
            background: linear-gradient(135deg, #3b3152, #16161d);
            font-size: 25px;
            font-weight: bold;
            transform: rotateY(180deg);
        }

        .tile-1 { --delay: 40ms; --flip-delay: -1.0s; grid-column: 1; grid-row: 1; }
        .tile-2 { --delay: 110ms; --flip-delay: -1.8s; grid-column: 2; grid-row: 1; }
        .tile-3 { --delay: 180ms; --flip-delay: -2.6s; grid-column: 3; grid-row: 1; }
        .tile-4 { --delay: 250ms; --flip-delay: -3.4s; grid-column: 1; grid-row: 2; }
        .tile-5 { --delay: 320ms; --flip-delay: -4.2s; grid-column: 2; grid-row: 2; }
        .tile-6 { --delay: 390ms; --flip-delay: -5.0s; grid-column: 3; grid-row: 2; }

        .logo-stage.is-open .cube-bob {
            animation: cube-open 850ms cubic-bezier(0.45, 0, 0.15, 1) forwards;
        }

        .logo-stage.is-open .cube {
            animation-play-state: paused;
        }

        .logo-stage.is-open .cube-shadow {
            opacity: 0;
            transform: translateX(-50%) scale(0.2);
            transition: opacity 350ms ease, transform 450ms ease;
        }

        .logo-stage.is-open .tiles {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .logo-stage.is-open .tile {
            opacity: 1;
            transform: scale(1) rotate(0) translateY(0);
        }

        .logo-stage.is-open .tile-inner {
            animation: tile-slideshow 6.2s var(--flip-delay) ease-in-out infinite;
        }

        .logo-stage.is-open .tile:hover {
            transform: scale(1.06) translateY(-5px) rotate(-2deg);
            transition-duration: 180ms;
        }

        .tagline {
            margin: 0;
            color: var(--muted);
            font-size: clamp(17px, 2.5vw, 23px);
            letter-spacing: -0.02em;
            animation: appear 700ms 170ms ease-out both;
        }

        .tagline span {
            color: var(--yellow-bright);
        }

        .enter-button {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-top: 24px;
            padding: 14px 18px 14px 23px;
            border-radius: 999px;
            color: #17161a;
            background: var(--yellow);
            box-shadow: 0 14px 30px rgba(243, 198, 68, 0.18);
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
            animation: appear 700ms 230ms ease-out both;
        }

        .enter-button::after {
            display: grid;
            width: 27px;
            height: 27px;
            place-items: center;
            border-radius: 50%;
            color: var(--yellow);
            background: #17161a;
            content: "↗";
            font-size: 17px;
            transition: transform 180ms ease;
        }

        .enter-button:hover,
        .enter-button:focus-visible {
            background: var(--yellow-bright);
            box-shadow: 0 18px 36px rgba(243, 198, 68, 0.3);
            transform: translateY(-3px);
        }

        .enter-button:hover::after,
        .enter-button:focus-visible::after {
            transform: translate(2px, -2px);
        }

        .enter-button:focus-visible {
            outline: 2px solid var(--white);
            outline-offset: 4px;
        }

        .hint {
            margin: 16px 0 0;
            color: #77747e;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            animation: appear 700ms 290ms ease-out both;
        }

        .hint::before {
            margin-right: 7px;
            color: var(--yellow);
            content: "✦";
        }

        @keyframes rotate-cube {
            from { transform: rotateX(-18deg) rotateY(0deg) rotateZ(1deg); }
            to { transform: rotateX(-18deg) rotateY(360deg) rotateZ(1deg); }
        }

        @keyframes bob {
            0%, 100% { transform: translate(-50%, calc(-50% + 9px)); }
            50% { transform: translate(-50%, calc(-50% - 11px)); }
        }

        @keyframes cube-open {
            0% { opacity: 1; transform: translate(-50%, calc(-50% - 9px)) scale(1) rotate(0); }
            45% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(14deg); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.06) rotate(180deg); }
        }

        @keyframes shadow {
            0%, 100% { opacity: 0.52; transform: translateX(-50%) scale(0.82); }
            50% { opacity: 0.3; transform: translateX(-50%) scale(1.08); }
        }

        @keyframes tile-slideshow {
            0%, 24% { transform: rotateY(0deg) rotateX(0deg); }
            38%, 67% { transform: rotateY(180deg) rotateX(3deg); }
            81%, 100% { transform: rotateY(360deg) rotateX(0deg); }
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            :root {
                --cube-size: 180px;
                --cube-depth: 90px;
                --tile-size: 68px;
                --tile-gap: 6px;
            }

            .page {
                padding-right: 13px;
                padding-left: 13px;
            }

            .logo-stage {
                height: 295px;
            }

            .logo-stage::before {
                width: 285px;
                height: 145px;
            }

            .logo-trigger:focus-visible::after {
                width: 290px;
                height: 155px;
            }
        }

        @media (max-height: 700px) {
            .page {
                justify-content: flex-start;
                padding-top: 25px;
            }

            .logo-stage {
                height: 270px;
                margin-top: 8px;
            }

            .enter-button {
                margin-top: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }

            .cube {
                transform: rotateX(-18deg) rotateY(-28deg) rotateZ(1deg) !important;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="intro">
            <p class="eyebrow">Join365 / Digital workspace</p>
            <h1>Welcome to Join365. <em>Your digital workspace</em></h1>
        </header>

        <section class="logo-stage" id="logoStage" aria-label="Interactive Join365 logo">
            <button class="logo-trigger" id="logoTrigger" type="button" aria-pressed="false" aria-label="Open the rotating Join365 cube">
                <span class="animation-space" aria-hidden="true">
                    <span class="cube-bob">
                        <span class="cube">
                            <span class="cube-face front"><img src="./logo.png" alt=""></span>
                            <span class="cube-face back"><img src="./logo.png" alt=""></span>
                            <span class="cube-face right"><img src="./logo.png" alt=""></span>
                            <span class="cube-face left"><img src="./logo.png" alt=""></span>
                            <span class="cube-face top"><img src="./logo.png" alt=""></span>
                            <span class="cube-face bottom"><img src="./logo.png" alt=""></span>
                        </span>
                    </span>
                    <span class="cube-shadow"></span>

                    <span class="tiles">
                        <span class="tile tile-1">
                            <span class="tile-inner">
                                <span class="tile-face tile-front"></span>
                                <span class="tile-face tile-back">J</span>
                            </span>
                        </span>
                        <span class="tile tile-2">
                            <span class="tile-inner">
                                <span class="tile-face tile-front"></span>
                                <span class="tile-face tile-back">O</span>
                            </span>
                        </span>
                        <span class="tile tile-3">
                            <span class="tile-inner">
                                <span class="tile-face tile-front"></span>
                                <span class="tile-face tile-back">I</span>
                            </span>
                        </span>
                        <span class="tile tile-4">
                            <span class="tile-inner">
                                <span class="tile-face tile-front"></span>
                                <span class="tile-face tile-back">N</span>
                            </span>
                        </span>
                        <span class="tile tile-5">
                            <span class="tile-inner">
                                <span class="tile-face tile-front"></span>
                                <span class="tile-face tile-back">3</span>
                            </span>
                        </span>
                        <span class="tile tile-6">
                            <span class="tile-inner">
                                <span class="tile-face tile-front"></span>
                                <span class="tile-face tile-back">65</span>
                            </span>
                        </span>
                    </span>
                </span>
            </button>
        </section>

        <p class="tagline">Everything you need. <span>One place</span></p>
        <a class="enter-button" href="https://join365.eu.cc/Tools">Enter the site</a>
        <p class="hint" id="hint">Click the cube to unfold it</p>
    </main>

    <script>
        (function () {
            var stage = document.getElementById("logoStage");
            var trigger = document.getElementById("logoTrigger");
            var hint = document.getElementById("hint");

            trigger.addEventListener("click", function () {
                var open = stage.classList.toggle("is-open");
                trigger.setAttribute("aria-pressed", String(open));
                trigger.setAttribute(
                    "aria-label",
                    open
                        ? "Return the six Join365 tiles to the rotating cube"
                        : "Open the rotating Join365 cube"
                );
                hint.textContent = open
                    ? "Click the tiles to rebuild the cube"
                    : "Click the cube to unfold it";
            });
        }());
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111216">
    <title>Join365 — Your digital workspace</title>
    <style>
        :root {
            --yellow: #f3c644;
            --yellow-light: #ffdb69;
            --cream: #fffaf0;
            --muted: #a6a3ad;
            --background: #111216;
            --cube-size: 220px;
            --cube-half: 110px;
            --tile-size: 88px;
            --tile-gap: 8px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--cream);
            background:
                radial-gradient(circle at 50% 42%, rgba(96, 71, 166, 0.25), transparent 34%),
                radial-gradient(circle at 8% 95%, rgba(243, 198, 68, 0.12), transparent 28%),
                var(--background);
            font-family: Arial, Helvetica, sans-serif;
        }

        body::before {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            content: "";
            opacity: 0.34;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
            background-size: 72px 72px;
        }

        .page {
            position: relative;
            z-index: 1;
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 42px 16px 34px;
            text-align: center;
        }

        .intro,
        .logo-stage,
        .tagline,
        .enter-button,
        .hint {
            position: relative;
            z-index: 1;
        }

        .intro {
            animation: enter 650ms ease-out both;
        }

        .eyebrow {
            margin: 0 0 18px;
            color: var(--yellow-light);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.25em;
            text-transform: uppercase;
        }

        h1 {
            max-width: 800px;
            margin: 0;
            color: var(--cream);
            font-size: clamp(35px, 6vw, 72px);
            font-weight: 700;
            letter-spacing: -0.06em;
            line-height: 0.98;
        }

        h1 span {
            color: var(--yellow);
        }

        .logo-stage {
            position: relative;
            width: min(100%, 500px);
            height: 350px;
            margin-top: 17px;
            animation: enter 700ms 100ms ease-out both;
        }

        .logo-stage::before {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(74vw, 335px);
            height: min(38vw, 175px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            content: "";
            pointer-events: none;
            transform: translate(-50%, -50%) rotate(-12deg);
        }

        .cube-button {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: block;
            width: 100%;
            height: 100%;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cube-button:focus-visible::after {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(76vw, 355px);
            height: min(42vw, 195px);
            border: 2px solid var(--yellow);
            border-radius: 50%;
            content: "";
            transform: translate(-50%, -50%) rotate(-12deg);
        }

        /* The perspective is on the immediate parent of the cube, so the 3D faces render consistently. */
        .cube-scene {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            perspective: 900px;
        }

        .cube-bob {
            position: relative;
            width: var(--cube-size);
            height: var(--cube-size);
            transform-style: preserve-3d;
            animation: bob 3.4s ease-in-out infinite;
        }

        .cube {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate-cube 12s linear infinite;
            filter: drop-shadow(0 24px 21px rgba(0, 0, 0, 0.45));
        }

        .cube-button:hover .cube {
            animation-duration: 7s;
        }

        /* Every face receives its own complete copy of the supplied logo. */
        .cube-face {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.56);
            border-radius: 22px;
            background: var(--yellow) url("./logo.png?v=2") center / cover no-repeat;
            backface-visibility: hidden;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14);
        }

        .cube-face img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cube-face::after,
        .tile-face::after {
            position: absolute;
            inset: 0;
            content: "";
            pointer-events: none;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), transparent 36%, rgba(0, 0, 0, 0.12));
            mix-blend-mode: soft-light;
        }

        .face-front { transform: translateZ(var(--cube-half)); }
        .face-back { transform: rotateY(180deg) translateZ(var(--cube-half)); }
        .face-right { transform: rotateY(90deg) translateZ(var(--cube-half)); }
        .face-left { transform: rotateY(-90deg) translateZ(var(--cube-half)); }
        .face-top { transform: rotateX(90deg) translateZ(var(--cube-half)); }
        .face-bottom { transform: rotateX(-90deg) translateZ(var(--cube-half)); }

        .cube-shadow {
            position: absolute;
            bottom: 26px;
            left: 50%;
            width: 150px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            filter: blur(14px);
            transform: translateX(-50%);
            animation: shadow 3.4s ease-in-out infinite;
        }

        /* Fallback: if a browser has no 3D support, the front logo still remains visible. */
        @supports not (transform-style: preserve-3d) {
            .cube-face {
                display: none;
            }

            .cube-face.face-front {
                display: block;
                transform: none;
            }
        }

        .tiles {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 3;
            display: grid;
            width: calc(var(--tile-size) * 3 + var(--tile-gap) * 2);
            height: calc(var(--tile-size) * 2 + var(--tile-gap));
            grid-template-columns: repeat(3, var(--tile-size));
            grid-template-rows: repeat(2, var(--tile-size));
            gap: var(--tile-gap);
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.18);
            transition: opacity 260ms ease 300ms, transform 700ms cubic-bezier(0.2, 0.85, 0.2, 1) 300ms;
        }

        .tile {
            width: var(--tile-size);
            height: var(--tile-size);
            perspective: 700px;
            opacity: 0;
            transform: translateY(20px) rotate(24deg) scale(0.12);
            transition: opacity 300ms ease var(--delay), transform 650ms cubic-bezier(0.2, 0.85, 0.2, 1) var(--delay);
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .tile-face {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 13px;
            backface-visibility: hidden;
            box-shadow: 0 14px 25px rgba(0, 0, 0, 0.28);
        }

        .tile-front {
            background: var(--yellow) url("./logo.png") center / cover no-repeat;
        }

        .tile-back {
            color: var(--yellow);
            background: linear-gradient(135deg, #3d3155, #15151c);
            font-size: 25px;
            font-weight: bold;
            transform: rotateY(180deg);
        }

        .tile-1 { --delay: 40ms; --flip: -0.9s; grid-column: 1; grid-row: 1; }
        .tile-2 { --delay: 110ms; --flip: -1.7s; grid-column: 2; grid-row: 1; }
        .tile-3 { --delay: 180ms; --flip: -2.5s; grid-column: 3; grid-row: 1; }
        .tile-4 { --delay: 250ms; --flip: -3.3s; grid-column: 1; grid-row: 2; }
        .tile-5 { --delay: 320ms; --flip: -4.1s; grid-column: 2; grid-row: 2; }
        .tile-6 { --delay: 390ms; --flip: -4.9s; grid-column: 3; grid-row: 2; }

        .logo-stage.is-open .cube-bob {
            animation: cube-open 850ms cubic-bezier(0.45, 0, 0.15, 1) forwards;
        }

        .logo-stage.is-open .cube {
            animation-play-state: paused;
        }

        .logo-stage.is-open .cube-shadow {
            opacity: 0;
            transform: translateX(-50%) scale(0.2);
            transition: opacity 350ms ease, transform 450ms ease;
        }

        .logo-stage.is-open .tiles {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .logo-stage.is-open .tile {
            opacity: 1;
            transform: translateY(0) rotate(0) scale(1);
        }

        .logo-stage.is-open .tile-inner {
            animation: slideshow 6.2s var(--flip) ease-in-out infinite;
        }

        .logo-stage.is-open .tile:hover {
            transform: translateY(-5px) rotate(-2deg) scale(1.06);
            transition-duration: 180ms;
        }

        .tagline {
            margin: 0;
            color: var(--muted);
            font-size: clamp(17px, 2.5vw, 23px);
            letter-spacing: -0.02em;
            animation: enter 700ms 160ms ease-out both;
        }

        .tagline span {
            color: var(--yellow-light);
        }

        .enter-button {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            margin-top: 24px;
            padding: 14px 18px 14px 23px;
            border-radius: 999px;
            color: #18171b;
            background: var(--yellow);
            box-shadow: 0 14px 30px rgba(243, 198, 68, 0.18);
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
            animation: enter 700ms 220ms ease-out both;
        }

        .enter-button::after {
            display: grid;
            width: 27px;
            height: 27px;
            place-items: center;
            border-radius: 50%;
            color: var(--yellow);
            background: #18171b;
            content: "↗";
            font-size: 17px;
            transition: transform 180ms ease;
        }

        .enter-button:hover,
        .enter-button:focus-visible {
            background: var(--yellow-light);
            box-shadow: 0 18px 36px rgba(243, 198, 68, 0.3);
            transform: translateY(-3px);
        }

        .enter-button:hover::after,
        .enter-button:focus-visible::after {
            transform: translate(2px, -2px);
        }

        .enter-button:focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 4px;
        }

        .hint {
            margin: 16px 0 0;
            color: #77747e;
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            animation: enter 700ms 280ms ease-out both;
        }

        .hint::before {
            margin-right: 7px;
            color: var(--yellow);
            content: "✦";
        }

        @keyframes rotate-cube {
            from { transform: rotateX(-18deg) rotateY(0deg) rotateZ(1deg); }
            to { transform: rotateX(-18deg) rotateY(360deg) rotateZ(1deg); }
        }

        @keyframes bob {
            0%, 100% { transform: translateY(9px); }
            50% { transform: translateY(-11px); }
        }

        @keyframes cube-open {
            0% { opacity: 1; transform: translateY(9px) scale(1) rotate(0); }
            45% { opacity: 1; transform: translateY(0) scale(1.12) rotate(14deg); }
            100% { opacity: 0; transform: translateY(0) scale(0.06) rotate(180deg); }
        }

        @keyframes shadow {
            0%, 100% { opacity: 0.52; transform: translateX(-50%) scale(0.82); }
            50% { opacity: 0.3; transform: translateX(-50%) scale(1.08); }
        }

        @keyframes slideshow {
            0%, 24% { transform: rotateY(0deg) rotateX(0deg); }
            38%, 67% { transform: rotateY(180deg) rotateX(3deg); }
            81%, 100% { transform: rotateY(360deg) rotateX(0deg); }
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            :root {
                --cube-size: 180px;
                --cube-half: 90px;
                --tile-size: 68px;
                --tile-gap: 6px;
            }

            .page {
                padding-right: 12px;
                padding-left: 12px;
            }

            .logo-stage {
                height: 295px;
            }
        }

        @media (max-height: 700px) {
            .page {
                justify-content: flex-start;
                padding-top: 24px;
            }

            .logo-stage {
                height: 270px;
                margin-top: 8px;
            }

            .enter-button {
                margin-top: 15px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="intro">
            <p class="eyebrow">Join365 / Digital workspace</p>
            <h1>Welcome to Join365. <span>Your digital workspace</span></h1>
        </header>

        <section class="logo-stage" id="logoStage" aria-label="Interactive Join365 logo">
            <button class="cube-button" id="cubeButton" type="button" aria-pressed="false" aria-label="Open the rotating Join365 cube">
                <span class="cube-scene" aria-hidden="true">
                    <span class="cube-bob">
                        <span class="cube">
                            <span class="cube-face face-front"><img src="./logo.png?v=2" alt=""></span>
                            <span class="cube-face face-back"><img src="./logo.png?v=2" alt=""></span>
                            <span class="cube-face face-right"><img src="./logo.png?v=2" alt=""></span>
                            <span class="cube-face face-left"><img src="./logo.png?v=2" alt=""></span>
                            <span class="cube-face face-top"><img src="./logo.png?v=2" alt=""></span>
                            <span class="cube-face face-bottom"><img src="./logo.png?v=2" alt=""></span>
                        </span>
                    </span>
                </span>
                <span class="cube-shadow" aria-hidden="true"></span>
            </button>

            <div class="tiles" aria-hidden="true">
                <div class="tile tile-1"><div class="tile-inner"><div class="tile-face tile-front"></div><div class="tile-face tile-back">J</div></div></div>
                <div class="tile tile-2"><div class="tile-inner"><div class="tile-face tile-front"></div><div class="tile-face tile-back">O</div></div></div>
                <div class="tile tile-3"><div class="tile-inner"><div class="tile-face tile-front"></div><div class="tile-face tile-back">I</div></div></div>
                <div class="tile tile-4"><div class="tile-inner"><div class="tile-face tile-front"></div><div class="tile-face tile-back">N</div></div></div>
                <div class="tile tile-5"><div class="tile-inner"><div class="tile-face tile-front"></div><div class="tile-face tile-back">3</div></div></div>
                <div class="tile tile-6"><div class="tile-inner"><div class="tile-face tile-front"></div><div class="tile-face tile-back">65</div></div></div>
            </div>
        </section>

        <p class="tagline">Everything you need. <span>One place</span></p>
        <a class="enter-button" href="https://join365.eu.cc/Tools">Enter the site</a>
        <p class="hint" id="hint">Click the cube to unfold it</p>
    </main>

    <script>
        (function () {
            var stage = document.getElementById("logoStage");
            var button = document.getElementById("cubeButton");
            var hint = document.getElementById("hint");

            button.addEventListener("click", function () {
                var open = stage.classList.toggle("is-open");
                button.setAttribute("aria-pressed", String(open));
                button.setAttribute(
                    "aria-label",
                    open
                        ? "Return the six Join365 logo squares to the cube"
                        : "Open the rotating Join365 cube"
                );
                hint.textContent = open
                    ? "Click the squares to rebuild the cube"
                    : "Click the cube to unfold it";
            });
        }());
    </script>
</body>
</html>

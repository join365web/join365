<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join365 — Coming Soon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 480px;
      width: 100%;
    }

    .logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }

    p {
      color: #888888;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .status {
      display: inline-block;
      border: 1px solid #333333;
      background: #0a0a0a;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #aaaaaa;
      margin-bottom: 40px;
    }

    .status span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: #ffffff;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }

    footer {
      border-top: 1px solid #1a1a1a;
      padding-top: 24px;
      font-size: 0.85rem;
      color: #666666;
    }

    footer a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px dotted #666666;
      transition: border-color 0.2s ease;
    }

    footer a:hover {
      border-bottom-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="https://htmltools.me/logo3.png" alt="HTMLTools Logo" class="logo">
    
    <h1>Join365</h1>
    <p>A simple, real-time chat platform currently under active development. Check back soon.</p>

    <div class="status">
      <span></span> Development in progress
    </div>

    <footer>
      Built by the creator of <a href="https://htmltools.me" target="_blank" rel="noopener">htmltools.me</a>
    </footer>
  </div>

</body>
</html>

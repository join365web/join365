<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join365 - Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 40px 30px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 1.8rem;
      color: #f0f6fc;
      margin-bottom: 12px;
    }

    p {
      font-size: 1rem;
      color: #8b949e;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      margin-top: 20px;
      padding: 6px 12px;
      background-color: rgba(56, 139, 253, 0.15);
      color: #58a6ff;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner"></div>
    <h1>Join365 is Under Construction</h1>
    <p>We're currently setting up the chat platform. Check back soon!</p>
    <div class="badge">Building in progress...</div>
  </div>

</body>
</html>
